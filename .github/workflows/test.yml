name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5 # node from mise.toml
      - uses: pnpm/action-setup@v6 # pnpm from package.json "packageManager"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test # rebuilds the bundles in scripts/ first
      - name: Committed bundles match src/
        run: test -z "$(git status --porcelain scripts/)" || (git status --short scripts/ && echo "::error::scripts/ is stale - run pnpm build and commit the result" && exit 1)
      # package.json promises node >= 18 at runtime; pnpm itself needs a newer node, so run the tests directly
      - uses: actions/setup-node@v7
        with:
          node-version: 18
      - name: Tests on node 18
        run: node --version && node test/cli.test.mjs && node test/proxy.test.mjs && node test/client.test.mjs && node test/drag.test.mjs && node test/ports.test.mjs
